[build]
  command = "npm run build"

# Security headers (audit S3). Netlify applies these to static files only; pages served by the
# Next.js runtime get the same headers from next.config.js. Keep both lists identical. Content-Security-Policy is intentionally not set yet:
# it needs careful tuning so the Google map, WhatsApp links and page scripts keep working.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Long-term browser cache for photos (audit P-series). No `immutable` because image files may be
# replaced at the same URL when Akash optimises them in task 2.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
